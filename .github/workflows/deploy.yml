name: Deploy Monitoring (③ EC2)

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'prometheus/**'
      - 'grafana/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-monitoring-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  S3_PREFIX: s3://team05-01-deploy-0708-635249349258-ap-northeast-2-an/monitoring/
  EC2_NAME_TAG: team05-01-monitoring

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write             # OIDC 토큰 발급(키리스 핵심)
      contents: read
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: AWS 자격증명 (OIDC, team05-github-actions)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::635249349258:role/team05-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: 설정파일 S3 업로드
        # .env/secrets는 S3에 없으므로(--delete 미사용) EC2 기존 파일 유지
        run: |
          aws s3 sync . "$S3_PREFIX" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".idea/*" \
            --exclude "README.md"

      - name: ③ EC2에서 받아 기동 (SSM send-command)
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$EC2_NAME_TAG" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          echo "대상 인스턴스: $INSTANCE_ID"
          if [ -z "$INSTANCE_ID" ]; then echo "running 인스턴스 없음"; exit 1; fi

          cat > params.json <<EOF
          {"commands":[
            "set -e",
            "aws s3 sync $S3_PREFIX /opt/monitoring",
            "cd /opt/monitoring",
            "docker compose --env-file .env pull",
            "docker compose --env-file .env up -d",
            "echo '헬스 체크: Grafana localhost:3000/api/health 대기...'",
            "for i in \$(seq 1 30); do curl -fs -o /dev/null http://localhost:3000/api/health && { echo 'OK: grafana UP'; break; }; [ \$i -eq 30 ] && { echo 'FAIL: 150초 후에도 비정상'; docker compose ps; exit 1; }; sleep 5; done"
          ]}
          EOF

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy monitoring ${{ github.sha }}" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "CommandId: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          echo "===== EC2 표준 출력 ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "최종 상태: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "===== EC2 표준 에러 ====="
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
